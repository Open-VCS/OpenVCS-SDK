name: Release OpenVCS-SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: sdk-v<Cargo.toml version>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - stable
      - Stable

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/openvcs-plugin dist/openvcs-plugin-${{ runner.os }}-x86_64
          tar -C dist -czf openvcs-plugin-${{ runner.os }}-x86_64.tar.gz openvcs-plugin-${{ runner.os }}-x86_64

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\openvcs-plugin.exe dist\openvcs-plugin-Windows-x86_64.exe -Force
          Compress-Archive -Path dist\openvcs-plugin-Windows-x86_64.exe -DestinationPath openvcs-plugin-Windows-x86_64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ runner.os }}
          path: |
            openvcs-plugin-*.tar.gz
            openvcs-plugin-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag || '' }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          ver = data["package"]["version"]
          print(f"tag=sdk-v{ver}")
          PY >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            artifacts/**/*

