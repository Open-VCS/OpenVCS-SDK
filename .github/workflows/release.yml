name: publish-stable
run-name: "OpenVCS-SDK • Release • Run #${{ github.run_number }}"

on:
  push:
    branches: [stable]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: sdk-v<Cargo.toml version>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '2G'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Build
        run: cargo build --release

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          mkdir -p dist
          cp target/release/openvcs-plugin "dist/openvcs-plugin-${{ runner.os }}-${ARCH}"
          tar -C dist -czf "openvcs-plugin-${{ runner.os }}-${ARCH}.tar.gz" "openvcs-plugin-${{ runner.os }}-${ARCH}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\openvcs-plugin.exe dist\openvcs-plugin-Windows-x86_64.exe -Force
          Compress-Archive -Path dist\openvcs-plugin-Windows-x86_64.exe -DestinationPath openvcs-plugin-Windows-x86_64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ runner.os }}
          path: |
            openvcs-plugin-*.tar.gz
            openvcs-plugin-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          ver = data["package"]["version"]
          print(f"sdk-v{ver}")
          PY
          )"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            artifacts/**/*
