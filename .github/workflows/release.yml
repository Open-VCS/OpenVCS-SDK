name: publish-stable
run-name: "OpenVCS-SDK • Release • Run #${{ github.run_number }}"

on:
  push:
    branches: [Stable]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: sdk-v<Cargo.toml version>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-windows:
    name: Build (Linux + Windows)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '2G'
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install cross-tooling
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Linux
        run: cargo build --release

      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Linux
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          mkdir -p dist
          cp target/release/openvcs-plugin "dist/openvcs-plugin-Linux-${ARCH}"
          tar -C dist -czf "openvcs-plugin-Linux-${ARCH}.tar.gz" "openvcs-plugin-Linux-${ARCH}"
          rm "dist/openvcs-plugin-Linux-${ARCH}"
          rmdir dist

      - name: Package Windows
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/openvcs-plugin.exe dist/openvcs-plugin-Windows-x86_64.exe
          zip -j openvcs-plugin-Windows-x86_64.zip dist/openvcs-plugin-Windows-x86_64.exe
          rm dist/openvcs-plugin-Windows-x86_64.exe
          rmdir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sdk-linux-windows
          path: |
            openvcs-plugin-Linux-*.tar.gz
            openvcs-plugin-Windows-*.zip

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '2G'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Package macOS
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          mkdir -p dist
          cp target/release/openvcs-plugin "dist/openvcs-plugin-macos-${ARCH}"
          tar -C dist -czf "openvcs-plugin-macos-${ARCH}.tar.gz" "openvcs-plugin-macos-${ARCH}"
          rm "dist/openvcs-plugin-macos-${ARCH}"
          rmdir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sdk-macos
          path: openvcs-plugin-macos-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          ver = data["package"]["version"]
          print(f"sdk-v{ver}")
          PY
          )"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            artifacts/**/*

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-24.04
    # Skip publishing when running a manual prerelease dispatch
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: stable

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Ensure the token is present (fail early with a helpful message)
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "ERROR: CARGO_REGISTRY_TOKEN secret is not set" >&2
            exit 1
          fi
          cargo publish
