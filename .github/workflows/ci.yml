name: Dev CI (fast)

on:
  push:
    branches: [Dev]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [Dev]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
