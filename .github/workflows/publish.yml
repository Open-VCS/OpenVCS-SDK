name: publish
run-name: "OpenVCS-SDK • Publish • Run #${{ github.run_number }} • ${{ github.event_name == 'schedule' && 'Nightly@Dev' || github.ref_name }}"

on:
  push:
    branches: [Stable, Beta]
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish nightly even if no changes since last nightly tag
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

env:
  TARGET_REF: ${{ github.event_name == 'schedule' && 'Dev' || github.ref_name }}

jobs:
  check-nightly:
    name: Check for SDK nightly changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      since_sha: ${{ steps.diff.outputs.since_sha }}
      ahead_count: ${{ steps.diff.outputs.ahead_count }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine diff vs openvcs-sdk-nightly
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(push)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="openvcs-sdk-nightly"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(none)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=INIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE_SHA="$(git rev-list -n 1 "$TAG")"
          echo "since_sha=$SINCE_SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$TAG"..HEAD -- src test scripts package.json package-lock.json tsconfig.json README.md AGENTS.md .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ahead_count=0" >> "$GITHUB_OUTPUT"
          else
            AHEAD="$(git rev-list --count "$TAG"..HEAD -- src test scripts package.json package-lock.json tsconfig.json README.md AGENTS.md .github/workflows || echo 1)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ahead_count=$AHEAD" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish @openvcs/sdk to npm
    if: github.ref_name == 'Stable' || github.ref_name == 'Beta' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [check-nightly]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compute publish metadata
        id: meta
        shell: bash
        env:
          FORCE_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || false) }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          if [ "${GITHUB_REF_NAME:-}" = "Stable" ]; then
            VERSION="$BASE_VERSION"
            DIST_TAG="latest"
            SHOULD_PUBLISH="true"
          elif [ "${GITHUB_REF_NAME:-}" = "Beta" ]; then
            VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
            DIST_TAG="beta"
            SHOULD_PUBLISH="true"
          else
            VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="nightly"
            if [ "${{ needs.check-nightly.outputs.changed || 'false' }}" = "true" ] || [ "${FORCE_NIGHTLY}" = "true" ]; then
              SHOULD_PUBLISH="true"
            else
              SHOULD_PUBLISH="false"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stop when nightly is unchanged
        if: steps.meta.outputs.should_publish != 'true'
        run: |
          echo "No SDK nightly changes since last publish; skipping."

      - name: Apply publish version
        if: steps.meta.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)+'\n');"

      - name: Verify npm package contents
        if: steps.meta.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Publish npm package
        if: steps.meta.outputs.should_publish == 'true'
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Update rolling nightly tag
        if: steps.meta.outputs.should_publish == 'true' && steps.meta.outputs.dist_tag == 'nightly'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'openvcs-sdk-nightly';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: process.env.TARGET_SHA || context.sha });
