[package]
name = "openvcs-sdk"
version = "0.2.0"
edition = "2024"
description = "SDK for building/bundling OpenVCS plugins and packaging them as .ovcsp bundles."
license = "GPL-3.0-or-later"
homepage = "https://bbgames.dev/"
repository = "https://github.com/Open-VCS/OpenVCS-SDK"
readme = "README.md"

keywords = [
    "openvcs",
    "sdk",
    "plugin",
    "node",
    "typescript"
]

categories = [
    "command-line-utilities",
    "development-tools::build-utils"
]

[[bin]]
name = "cargo-openvcs"
path = "src/bin/cargo-openvcs.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
xz2 = "0.1"
