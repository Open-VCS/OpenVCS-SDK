[package]
name = "openvcs-sdk"
version = "0.2.0"
edition = "2024"
default-run = "openvcs-plugin"
description = "SDK for building/bundling OpenVCS plugins and packaging them as .ovcsp bundles."
license = "GPL-3.0-or-later"
homepage = "https://bbgames.dev/"
repository = "https://github.com/Open-VCS/OpenVCS-SDK"
readme = "README.md"

keywords = [
    "openvcs",
    "sdk",
    "plugin",
    "wasi",
    "wasm"
]

categories = [
    "command-line-utilities",
    "development-tools::build-utils",
    "wasm"
]

[[bin]]
name = "openvcs-plugin"
path = "src/main.rs"

[[bin]]
name = "cargo-openvcs"
path = "src/bin/cargo-openvcs.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
xz2 = "0.1"
wasmparser = "0.245"
wasm-encoder = "0.245"
wit-component = "0.245"
wit-parser = "0.245"
wasi-preview1-component-adapter-provider = "41"
